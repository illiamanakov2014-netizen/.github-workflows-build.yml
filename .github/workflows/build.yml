name: Build APK from ZIP
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p project
          unzip -o *.zip -d project
          echo "Распаковано:"
          find project -type f | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJ_DIR=$(dirname "$(find project -name settings.gradle | head -1)")
          echo "Корень проекта: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniDuck-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
